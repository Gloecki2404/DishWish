[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "SLF001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["starter: let the integration add its starter dishes (off by default in tests)"]
testpaths = ["tests"]
pythonpath = ["."]
