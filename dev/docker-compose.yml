services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    ports: ["8123:8123"]
    environment: ["TZ=Europe/Berlin"]
    volumes:
      - ./config:/config
      - ../custom_components/essensplan:/config/custom_components/essensplan
  test:
    build: { context: .., dockerfile: dev/Dockerfile.test }
    working_dir: /repo
    volumes: ["..:/repo"]
