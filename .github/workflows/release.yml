name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the version in manifest.json
        run: |
          manifest=$(python3 -c "import json;print(json.load(open('custom_components/dishwish/manifest.json'))['version'])")
          if [ "v$manifest" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version v$manifest" >&2
            exit 1
          fi
      - name: Release notes from CHANGELOG.md
        run: |
          python3 - <<'EOF'
          import os, re, sys
          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.S | re.M)
          if not match:
              sys.exit(f"CHANGELOG.md has no section for {version}")
          open("release-notes.md", "w", encoding="utf-8").write(match.group(1).strip() + "\n")
          EOF
      - name: Package the integration
        run: cd custom_components/dishwish && zip -r ../../dishwish.zip . -x "__pycache__/*"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dishwish.zip --notes-file release-notes.md --title "DishWish $GITHUB_REF_NAME"